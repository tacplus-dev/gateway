stages:
  - prepare
  - build
  - package

variables:
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"
  TACPLUS_PROJECT_ID: "78207479"
  PROTO_REPO: https://gitlab.com/secondstarcavalier/controlplane/services/proto.git
  WEBAPP_PROJECT_ID: "${WEBAPP_PROJECT_ID}"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

prepare:
  stage: prepare
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - *parse-version
    - |
      WEBAPP_PKG="webapp-${MAJOR}-${MINOR}"
      echo "Downloading ${WEBAPP_PKG}-latest.tgz..."
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -fsSL -o webapp.tgz \
           "${CI_API_V4_URL}/projects/${WEBAPP_PROJECT_ID}/packages/generic/${WEBAPP_PKG}/latest/${WEBAPP_PKG}-latest.tgz"
      mkdir -p dist
      tar -xzf webapp.tgz -C dist
      ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

build:
  stage: build
  image: golang:1.25-alpine
  needs:
    - prepare
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache git curl unzip
    - *setup-netrc
    - |
      ARCH=$(uname -m)
      if [ "$ARCH" = "aarch64" ]; then PROTOC_ARCH="linux-aarch_64"; else PROTOC_ARCH="linux-x86_64"; fi
      curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-${PROTOC_ARCH}.zip"
      unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
      chmod +x /usr/local/bin/protoc
    - |
      if [ "$ARCH" = "aarch64" ]; then TACPLUS_ARCH="linux-arm64"; else TACPLUS_ARCH="linux-amd64"; fi
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -fsSL -o /usr/local/bin/tacplus \
           "${CI_API_V4_URL}/projects/${TACPLUS_PROJECT_ID}/packages/generic/tacplus-1-1/latest/tacplus-1-1-latest-${TACPLUS_ARCH}"
      chmod +x /usr/local/bin/tacplus
    - git clone --depth 1 "$PROTO_REPO" /tmp/proto
    - tacplus build --src /tmp/proto
  script:
    - |
      for target in linux/amd64 linux/arm64; do
        GOOS="${target%/*}"
        GOARCH="${target#*/}"
        echo "Building gateway for ${GOOS}/${GOARCH}..."
        GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "bin/gateway-${GOARCH}" .
      done
  artifacts:
    paths:
      - bin/gateway-*
      - dist/
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "${IMAGE}:${PATCH}" \
        -t "${IMAGE}:latest" \
        --push .
