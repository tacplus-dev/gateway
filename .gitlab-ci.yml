stages:
  - build
  - package
  - manifest

# Trigger webapp build in parallel with gateway cargo build.
# Package stage waits for both before baking the container.
build-webapp:
  stage: .pre
  trigger:
    project: secondstarcavalier/schematic/platform/clients/webapp
    branch: main
    strategy: depend
  variables:
    TRIGGERED_BY_GATEWAY: "true"
    GATEWAY_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/

compute-image:
  stage: .pre
  image: alpine:latest
  tags:
    - schematic-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      IMAGE="${CI_REGISTRY}/${REPO}:latest"
      echo "TACPLUS_IMAGE=${IMAGE}" > tacplus.env
      echo "Using tacplus image: ${IMAGE}"
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  DOCKER_TLS_CERTDIR: ""
  WEBAPP_PROJECT_ID: "81967224"
  CAVALIER_PROJECT_ID: "81967223"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

# ---------------------------------------------------------------------------
# Build: compile the gateway binary only (no webapp, no cavalier clients).
# Webapp and clients are installed in the container at package time.
# ---------------------------------------------------------------------------
.build-arch:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    - key: cargo-$ARCH
      paths:
        - .cargo-home/registry
        - .cargo-home/git
  before_script:
    - *setup-netrc
    - tacplus build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/gateway
    expire_in: 1 hour

build-arm64:
  extends: .build-arch
  tags:
    - schematic-aarch64
  variables:
    ARCH: arm64

# ---------------------------------------------------------------------------
# Package: download webapp + cavalier clients, bake into container.
# When only webapp or cavalier changes, retag gateway to rebuild just this.
# ---------------------------------------------------------------------------
.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Download webapp dist
    - |
      WEBAPP_PKG="webapp-${MAJOR}-${MINOR}"
      echo "Downloading webapp dist..."
      mkdir -p webapp-dist
      wget -q --header="JOB-TOKEN: $CI_JOB_TOKEN" \
        -O webapp.tgz \
        "${CI_API_V4_URL}/projects/${WEBAPP_PROJECT_ID}/packages/generic/${WEBAPP_PKG}/latest/${WEBAPP_PKG}-latest.tgz" \
        || echo "WARN: webapp not available"
      [ -f webapp.tgz ] && tar -xzf webapp.tgz -C webapp-dist && rm webapp.tgz || true
    # Download cavalier client binaries
    - |
      CAVALIER_PKG="cavalier-${MAJOR}-${MINOR}"
      echo "Downloading cavalier client binaries..."
      mkdir -p clients
      for target in linux-arm64 linux-amd64 darwin-arm64 windows-amd64.exe; do
        echo "  ${target}..."
        wget -q --header="JOB-TOKEN: $CI_JOB_TOKEN" \
          -O "clients/cavalier-${target}" \
          "${CI_API_V4_URL}/projects/${CAVALIER_PROJECT_ID}/packages/generic/${CAVALIER_PKG}/latest/${CAVALIER_PKG}-latest-${target}" \
          || echo "  WARN: ${target} not available, skipping"
      done
      ls -lh clients/
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker build --platform "linux/${ARCH}" \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  needs:
    - build-arm64
    - build-webapp
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  tags:
    - schematic-aarch64
  needs:
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"
# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  tags:
    - schematic-amd64
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/${REPO}:latest" > tacplus.env
      echo "Using tacplus image: ${CI_REGISTRY}/${REPO}:latest"
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --tag $PROTO_VERSION
