stages:
  - prepare
  - build
  - package

variables:
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"
  WEBAPP_PROJECT_ID: "${WEBAPP_PROJECT_ID}"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

prepare:
  stage: prepare
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - *parse-version
    - |
      WEBAPP_PKG="webapp-${MAJOR}-${MINOR}"
      echo "Downloading ${WEBAPP_PKG}-latest.tgz..."
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -fsSL -o webapp.tgz \
           "${CI_API_V4_URL}/projects/${WEBAPP_PROJECT_ID}/packages/generic/${WEBAPP_PKG}/latest/${WEBAPP_PKG}-latest.tgz"
      mkdir -p dist
      tar -xzf webapp.tgz -C dist
      ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

build:
  stage: build
  image: golang:1.25-alpine
  needs:
    - prepare
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache git
    - *setup-netrc
  script:
    - go build -trimpath -ldflags="-s -w" -o bin/gateway .
  artifacts:
    paths:
      - bin/gateway
      - dist/
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker build -t "${IMAGE}:${PATCH}" .
      docker tag "${IMAGE}:${PATCH}" "${IMAGE}:latest"
      docker push "${IMAGE}:${PATCH}"
      docker push "${IMAGE}:latest"
