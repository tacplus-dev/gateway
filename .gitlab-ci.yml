stages:
  - build
  - package
  - manifest

# Trigger webapp build and wait for it to publish before gateway builds.
# Gateway embeds the webapp dist; this ensures it always gets the latest.
build-webapp:
  stage: .pre
  trigger:
    project: secondstarcavalier/schematic/platform/clients/webapp
    branch: main
    strategy: depend
  variables:
    TRIGGERED_BY_GATEWAY: "true"
    GATEWAY_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - apk add --no-cache curl jq
    - |
      # Read pinned tacplus version from tacplus.yaml (required).
      # Format: "MAJOR.MINOR.PATCH" where PATCH is a number or "x" (resolve latest).
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/utils/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        # Query registry for the highest numeric patch tag.
        TOKEN=$(curl -sf "https://${CI_REGISTRY}/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
          -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | jq -r .token)
        PATCH=$(curl -sf -H "Authorization: Bearer $TOKEN" \
          "https://${CI_REGISTRY}/v2/${REPO}/tags/list" \
          | jq -r '.tags[]' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
        echo "Resolved tacplus ${MAJOR}.${MINOR}.x -> ${MAJOR}.${MINOR}.${PATCH}"
      fi
      IMAGE="${CI_REGISTRY}/${REPO}:${PATCH}"
      echo "TACPLUS_IMAGE=${IMAGE}" > tacplus.env
      echo "Using tacplus image: ${IMAGE}"
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  DOCKER_TLS_CERTDIR: ""
  WEBAPP_PROJECT_ID: "81967224"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image, build-webapp]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    - key: tacplus
      paths:
        - tacplus/
    - key: cargo-$ARCH
      paths:
        - .cargo-home/registry
        - .cargo-home/git
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
    - |
      set -euo pipefail
      V="${CI_COMMIT_TAG#v}"
      DOTPART="${V%%-*}"
      MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
      MINOR="$(echo "$DOTPART" | cut -d. -f2)"
      WEBAPP_PKG="webapp-${MAJOR}-${MINOR}"
      echo "Downloading webapp dist..."
      mkdir -p dist
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        -o webapp.tgz \
        "${CI_API_V4_URL}/projects/${WEBAPP_PROJECT_ID}/packages/generic/${WEBAPP_PKG}/latest/${WEBAPP_PKG}-latest.tgz"
      tar -xzf webapp.tgz -C dist
      rm webapp.tgz
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/gateway
    expire_in: 1 hour

build-arm64:
  extends: .build-arch
  tags:
    - schematic-aarch64
  variables:
    ARCH: arm64

.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker pull "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" || true
      docker build --platform "linux/${ARCH}" \
        --cache-from "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  needs:
    - build-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  tags:
    - schematic-aarch64
  needs:
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"
# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - apk add --no-cache curl jq
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/utils/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        TOKEN=$(curl -sf "https://${CI_REGISTRY}/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
          -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | jq -r .token)
        PATCH=$(curl -sf -H "Authorization: Bearer $TOKEN" \
          "https://${CI_REGISTRY}/v2/${REPO}/tags/list" \
          | jq -r '.tags[]' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
      fi
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/${REPO}:${PATCH}" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
