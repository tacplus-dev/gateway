stages:
  - build
  - package
  - manifest

# Trigger webapp build and wait for it to publish before gateway builds.
# Gateway embeds the webapp dist; this ensures it always gets the latest.
build-webapp:
  stage: .pre
  trigger:
    project: secondstarcavalier/schematic/platform/clients/webapp
    branch: main
    strategy: depend
  variables:
    TRIGGERED_BY_GATEWAY: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  WEBAPP_PROJECT_ID: "81967224"
  WEBAPP_PKG: "webapp-1-2"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image, build-webapp]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    - key: tacplus
      paths:
        - tacplus/
    - key: cargo-$ARCH
      paths:
        - .cargo-home/registry
        - .cargo-home/git
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
    - |
      set -euo pipefail
      echo "Downloading webapp dist..."
      mkdir -p dist
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        -o webapp.tgz \
        "${CI_API_V4_URL}/projects/${WEBAPP_PROJECT_ID}/packages/generic/${WEBAPP_PKG}/latest/${WEBAPP_PKG}-latest.tgz"
      tar -xzf webapp.tgz -C dist
      rm webapp.tgz
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/gateway
    expire_in: 1 hour

build-amd64:
  extends: .build-arch
  variables:
    ARCH: amd64

build-arm64:
  extends: .build-arch
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: arm64

.package-arch:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker pull "${IMAGE}:latest-${ARCH}" || true
      docker build \
        --cache-from "${IMAGE}:latest-${ARCH}" \
        -t "${IMAGE}:${PATCH}-${ARCH}" \
        -t "${IMAGE}:latest-${ARCH}" \
        .
      docker push "${IMAGE}:${PATCH}-${ARCH}"
      docker push "${IMAGE}:latest-${ARCH}"

package-amd64:
  extends: .package-arch
  needs:
    - build-amd64
  variables:
    ARCH: amd64

package-arm64:
  extends: .package-arch
  needs:
    - build-arm64
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  image: docker:latest
  services:
    - docker:dind
  needs:
    - package-amd64
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/gateway-${MAJOR}-${MINOR}"
      docker manifest create "${IMAGE}:${PATCH}" \
        "${IMAGE}:${PATCH}-amd64" \
        "${IMAGE}:${PATCH}-arm64"
      docker manifest push "${IMAGE}:${PATCH}"
      docker manifest create "${IMAGE}:latest" \
        "${IMAGE}:${PATCH}-amd64" \
        "${IMAGE}:${PATCH}-arm64"
      docker manifest push "${IMAGE}:latest"

# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - V="${PROTO_VERSION#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
