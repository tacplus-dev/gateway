<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { width: min(28rem, 92vw); }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .host { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.5rem; }
    button { display: block; width: 100%; padding: 0.75rem; margin: 0.5rem 0; font: inherit; cursor: pointer; }
    .error { color: #b00020; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; }
    dt { opacity: 0.7; }
    dd { margin: 0; word-break: break-all; }
  </style>
</head>
<body>
  <main id="app"><h1>Sign in</h1><p class="host"></p><p>Loading…</p></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
