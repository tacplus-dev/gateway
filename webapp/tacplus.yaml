# The gateway's own web console: a tacplus TypeScript client generated against
# the fleet's merged protos (--src, as the image build passes it), served by the
# gateway from webapp-dist/. Its client dependencies are declared in
# proto/clients/webapp.proto. Today it is the sign-in page.
language: typescript
src: proto
output-dir: model
# The web app calls oauth.Auth, gateway.Mint and kernel.UserMint (webapp.proto);
# against the fleet tree it generates from exactly those contracts. stratum is
# here because kernel's contract hosts every service's config, and the records
# among those (letsencrypt's) need the query plane stratum declares and the
# broker eventbus declares.
depends:
  - gateway
  - eventbus
  - kernel
  - stratum
  - oauth
