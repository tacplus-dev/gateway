syntax = "proto3";
package gateway;

message Config {

  // How often to refresh health state (seconds). Default 5.
  int64 health_poll_interval_seconds = 1;

  // Enable TCP listener for HTTP/1.1, HTTP/2, and gRPC. Default true.
  bool enable_tcp = 2;

  // Enable QUIC/UDP listener for HTTP/3. Default true.
  bool enable_quic = 3;
}
