syntax = "proto3";
package gateway;

import "sys/spec.proto";
import "sys/host.proto";
import "google/protobuf/empty.proto";
import "sys/jwk.proto";
import "sys/x509.proto";
import "sys/tokenrequest.proto";

option (spec.service) = {gateway: true, rest_dispatch: true};
option (spec.state_imports) = {source: "letsencrypt.LetsEncryptState"};
option (spec.state_imports) = {source: "kernel.Ca"};
// gateway's C2S Mint front proxies all token + cert ops (TokenMint,
// MintClientToken, X509Mint) to kernel.Mint — kernel (the cluster trust root)
// is the sole signing authority.
option (spec.grpc_s2s_client) = {service: "kernel.Mint"};

// ExternalTlsMode controls how gateway provisions its public-facing TLS certificate.
enum ExternalTlsMode {
  EXTERNAL_TLS_MODE_UNSPECIFIED = 0;

  // CERT_CHAIN: use the cert and key supplied in external_cert_pem / external_key_pem.
  EXTERNAL_TLS_MODE_CERT_CHAIN  = 1;

  // LETSENCRYPT: obtain and renew the certificate automatically via LetsEncrypt.
  // Gateway subscribes RO to LetsEncryptState for the current cert.
  EXTERNAL_TLS_MODE_LETSENCRYPT = 2;
}

message Config {

  option (spec.grpc_config) = {service_name: "gateway"};
  option (spec.event_publish) = {
    topic_ref: "agentsensor.TraceEventBus.trace_events"
    method_s2s: {auth_services: ["*"]}
  };

  // How often to refresh health state (seconds). Default 5.
  int64 health_poll_interval_seconds = 1 [(spec.default_int) = 5];

  // Enable HTTP/1.1 and HTTP/2 listener (TCP). Default true.
  bool enable_http = 2 [(spec.default_bool) = true];

  // Enable HTTP/3 listener (QUIC/UDP). Default true.
  bool enable_http3 = 3 [(spec.default_bool) = true];

  // Enable gRPC listener (TCP). Default true.
  bool enable_grpc = 4 [(spec.default_bool) = true];

  // TCP listener for HTTP/1.1, HTTP/2, and gRPC. Default port 8443.
  host.Host tcp_listener = 5 [(spec.default_host) = {host: "0.0.0.0", port: 8443}];

  // QUIC/UDP listener for HTTP/3. Default port 8443.
  host.Host quic_listener = 6 [(spec.default_host) = {host: "0.0.0.0", port: 8443}];

  // external_tls_mode controls how the public-facing TLS certificate is provisioned.
  ExternalTlsMode external_tls_mode = 7;

  // external_hostnames lists the domain names gateway serves externally.
  // Used for SNI-based cert selection at runtime. In LETSENCRYPT mode,
  // letsencrypt.Config.hostnames must match this list.
  repeated string external_hostnames = 8 [(spec.assert_max_size) = 16];

  // external_cert_pem is the PEM-encoded certificate chain for CERT_CHAIN mode.
  // Ignored in LETSENCRYPT mode. Supplied via secrets overlay — never committed to VCS.
  string external_cert_pem = 9;

  // external_key_pem is the PEM-encoded private key for CERT_CHAIN mode.
  // Ignored in LETSENCRYPT mode. Supplied via secrets overlay — never committed to VCS.
  string external_key_pem = 10;

  // root_ca holds the root CA certificate(s) that clients should trust when
  // connecting to the gateway's external HTTPS endpoint. Served via PublicCa
  // so clients (schematicctl, webapp) can configure TLS trust automatically.
  // Required in CERT_CHAIN mode. Omit in LETSENCRYPT mode (publicly trusted).
  repeated x509.X509Cert root_ca = 11 [(spec.assert_max_size) = 4];

  // http_listener is the PLAINTEXT listener behind the edge's port 80. The
  // gateway owns port 80 as well as 443: one LoadBalancer carries both, so
  // there is no second externally-exposed Service to reach the ACME responder
  // with.
  //
  // On this listener the gateway does exactly three things:
  //   - GET/HEAD /.well-known/acme-challenge/* is proxied to acme_backend
  //   - any other GET/HEAD gets a 301 to the same path on https://
  //   - any other method gets a 405
  //
  // Empty disables the listener — nothing binds. It has no declared default
  // because the answer depends on external_tls_mode, which tacplus cannot
  // express as a conditional default: the operator sets it (to 0.0.0.0:8080,
  // the container-side port the LoadBalancer's port 80 targets) exactly when
  // external_tls_mode = LETSENCRYPT, and leaves it empty otherwise.
  host.Host http_listener = 12;

  // acme_backend is the IN-CLUSTER address of the letsencrypt service's
  // HTTP-01 responder — its own http_listener, reachable on the letsencrypt
  // ClusterIP Service. The gateway is the only thing that reaches it; the
  // responder is no longer exposed outside the cluster.
  //
  // Empty while http_listener is set means challenge requests are answered
  // 503: the redirect and 405 halves still work, but no certificate can be
  // issued. Set together with http_listener.
  host.Host acme_backend = 13;

  // web_bundles chooses the static bundle served on a hostname. A browser
  // request (GET/HEAD the REST routes do not claim) whose Host matches a
  // bundle's hostname -- port ignored, case-insensitive -- is served from that
  // bundle's dir, with the same index.html fallback for client-side routes.
  // Any other Host is served exactly as before (WEB_ROOT, else the embedded
  // assets). Every bundle is same-origin with the API: one listener, one
  // certificate, so there is no CORS.
  //
  // Each hostname must also be in external_hostnames -- and, in LETSENCRYPT
  // mode, in letsencrypt.Config.hostnames -- or browsers reject the cert.
  repeated WebBundle web_bundles = 14 [(spec.assert_max_size) = 16];
}

// WebBundle is one hostname's static bundle, a directory baked into the
// gateway image (e.g. /opt/schematic/web).
message WebBundle {
  string hostname = 1 [(spec.assert_required) = true, (spec.assert_max_size) = 253];
  string dir = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 1024];
}

// PublicCaResponse holds the cluster root CA certificate(s).
// Clients use these to configure TLS trust when connecting to the gateway.
message PublicCaResponse {
  repeated x509.X509Cert certs = 1 [(spec.assert_max_size) = 16];
}

// Mint is gateway's token authority front-end. Gateway owns the OIDC
// discovery and JWKS endpoints (it already watches JWK keys from kernel).
// TokenMint and X509Mint are delegated to kernel via the direct kernel channel.
service Mint {
  option (spec.service_c2s) = {};
  // Client-reachable C2S front that proxies the authoritative S2S minter.
  option (spec.token_minter) = {proxy: true};

  // GetOpenIdConfig returns the OpenID Connect discovery document.
  // Gateway is the public-facing authority; the issuer URL is the gateway FQDN.
  rpc GetOpenIdConfig(google.protobuf.Empty) returns (jwk.OpenIdConfiguration) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_PUBLIC_NO_AUTH]};
    option (spec.rest_method) = {methods: [REST_METHOD_GET]};
    option (spec.rest_path) = ".well-known/openid-configuration";
  }

  // ListJwks returns the current JSON Web Key Set for token verification.
  // Gateway watches kernel's verifying keys and serves them at this endpoint.
  rpc ListJwks(google.protobuf.Empty) returns (jwk.Jwks) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_PUBLIC_NO_AUTH]};
    option (spec.method_collection) = {mode: COLLECTION_MODE_SNAPSHOT, order_by: ["kid"], max_items: 16};
    option (spec.rest_method) = {methods: [REST_METHOD_GET]};
    option (spec.rest_path) = ".well-known/jwks.json";
  }

  // MintToken mints a signed JWT token. Delegated to kernel's Mint service.
  rpc MintToken(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_SELF_AUTHENTICATES]};
  }

  // MintX509Cert signs an X.509 certificate. Delegated to kernel's Mint service.
  rpc MintX509Cert(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_SELF_AUTHENTICATES]};
  }

  // ListPublicCa returns the cluster root CA certificate(s).
  // Clients (e.g. schematicctl) use these to verify TLS connections to the gateway.
  // No authentication required — the CA is public trust anchor information.
  rpc ListPublicCa(google.protobuf.Empty) returns (PublicCaResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_PUBLIC_NO_AUTH]};
    option (spec.method_collection) = {mode: COLLECTION_MODE_SNAPSHOT, order_by: ["id"], max_items: 16};
    option (spec.rest_method) = {methods: [REST_METHOD_GET]};
  }
}
