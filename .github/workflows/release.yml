name: release

# On a version tag vX.Y.Z: create its GitHub release, with the commits since the previous release as its notes
# (ci/release-notes.sh), marked Latest only when it is the highest release (ci/release-latest.sh), so a patch
# on an older line, or an older release published late, never takes Latest. A pre-release (vX.Y.Z-rc.N) is
# marked one. Fleets pin the release line X.Y (tacplus-dev/tacplus#180).
#
# No image: the gateway is built per fleet, by the fleet builder, from the tag
# (tacplus-dev/roadmap decisions/gateway-per-fleet-2026-10-27.md). The tag is made on a commit whose build is
# green (the build pipeline, tacplus-dev/build); this workflow does not build it again.
#
# workflow_dispatch releases a tag that already exists (one pushed before this workflow, v0.1.0, say). With
# publish unset it is a dry run: it prints the release it would create and creates nothing. Neither mode
# makes or moves a tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The existing tag to release, e.g. v0.1.0"
        required: true
      publish:
        description: "Create its GitHub release (unset: a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, so of two tags the later run sees the other's release before it marks Latest.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag: the notes and Latest depend on the releases already made.
          fetch-depth: 0
      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          flag="$(ci/release-latest.sh "$VERSION")"
          ci/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "$VERSION at $(git rev-parse "refs/tags/$VERSION^{commit}"), release: $flag"
          cat "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLAG: ${{ steps.plan.outputs.flag }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "$FLAG"
