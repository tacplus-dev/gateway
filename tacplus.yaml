language: rust
pkg: com.gitlab.secondstarcavalier.controlplane.services.gateway
output-dir: target/generated-sources/tacplus
all-grpc: true
states:
  - services/kernel.GatewayTlsState:ro
post-gen:
  - cmd: mkdir
    args: [-p, dist]
  - cmd: cargo
    args: [build, --release]
container:
  image: registry.gitlab.com/secondstarcavalier/controlplane/services/gateway/gateway
