[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
bytes = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
base64 = "0.22"
rust-embed = "8"
rustls = { version = "0.23", features = ["ring"], default-features = false }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
gateway-tacplus = { path = "target/generated-sources/tacplus" }
gateway-jwk = { package = "jwk", path = "target/generated-sources/tacplus/libs/jwk" }
gateway-token = { package = "token", path = "target/generated-sources/tacplus/libs/token" }

[build-dependencies]
serde_json = "1"
