[package]
name = "gateway"
version = "1.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
base64 = "0.22"
rust-embed = "8"
rustls = { version = "0.23", features = ["ring"], default-features = false }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
gateway-model = { path = "target/generated-sources/model" }
gateway-jwk = { package = "jwk", path = "target/generated-sources/model/chassis/jwk" }
gateway-logger = { package = "logger", path = "target/generated-sources/model/chassis/logger" }
gateway-servicemanager = { package = "servicemanager", path = "target/generated-sources/model/chassis/servicemanager" }
gateway-token = { package = "token", path = "target/generated-sources/model/chassis/token" }
gateway-grpcserver = { package = "grpcserver", path = "target/generated-sources/model/chassis/grpcserver" }
